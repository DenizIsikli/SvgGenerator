name: SVG Generator

on:
  schedule:
    - cron: "0 * * * *" # Every hour
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**/*.ts"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/svgGenerator.yml"

permissions:
  contents: write

concurrency:
  group: svg-generator
  cancel-in-progress: false

jobs:
  update-svg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Generate GitHub streak SVG
        run: npm run generate:streak

      - name: Generate LeetCode SVG
        if: always()
        run: npm run generate:leetcode

      - name: Generate Codeforce SVG
        if: always()
        run: npm run generate:codeforce

      - name: Commit changed SVGs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/svg
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update SVGs"
          git push
